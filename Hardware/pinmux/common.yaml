# Shared config for ALL boards/products (loaded by model.py into every product).
# Controlled tag vocabulary (facets). Add here first, then use on pins. check.py rejects unknown tags.
default_level: 1.8
tag_vocab:
  iface:  [audio, i2c, uart, can, sd, spi, pwm, hdmi, pcie, m2, gpio, power, reset, ethernet, usb, jtag, boot]
  bus:    [sai5, sai6, sai7, sai3, i2c2, i2c3, i2c4, i2c5, i2c6, can1, can2, sd1, sd2, ecspi2, uart1, uart2, uart3, uart4]
  role:   [speaker, mic, bclk, lrclk, mclk, clk, data, sync, enable, int, prog, console, pwr-ctrl, gnd, rail, reserved, shifter]
  sys:    [sound, camera, supervisor, sensors, m2keyb, debug, media]
  volt:   [v1p8, v3p3, v5]
  status: [measured, tentative, unverified]
  profile: [product, bench]
