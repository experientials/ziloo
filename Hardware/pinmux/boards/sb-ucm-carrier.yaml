# BOARD — CompuLab SB-UCM-iMX8Plus evaluation carrier. Hosts one UCM-iMX8M-Plus SoM (via P1/P2).
# Surfaces SoM balls on the P20/P21/P10 0.1" headers. This is the BENCH host board — downstream
# devices are hand-cabled off the headers (there is no on-board DF40 media/sound connector here).
#
# AUTHORITY: this is a CompuLab board, NOT a Talki board. Carrier facts (pin functions, what's on a
# bus, boot flow) come from CompuLab's OFFICIAL docs (reference guide, P1/P2 hookups, carrier design
# package). The `func`/`dest` below are OUR intended allocation — a PLAN — not CompuLab's definition.
# Note per official docs: SYS_I2C = I2C2 (RTC/EEPROM, P1-97/99); I2C3 (P1-91/94) is general-purpose.
# The SYS_I2C device map in pinouts/SYS_I2C_ADDRESSES.md is a TALKI FACEBOARD bus, not this carrier.
#
# 2-layer: this file holds each header pin's chosen func + destination (the allocation).
# Fields: som (SoM ball) · func · dest · alts (other muxes the ball offers) · pad · verified · tags
kind: board
name: SB-UCM-iMX8Plus carrier
hosts: [ucm-imx8mp]

connectors:
  P20: {desc: "2x17 0.1in expansion header", pins: 34, power: "5V / 3V3 / GND (unlisted pins)"}
  P21: {desc: "2x17 0.1in expansion header", pins: 34}
  P10: {desc: "2x5 power/reset/system-control (DR10SM)", pins: 10, note: "pin order tentative — verify sheet 6"}
  P7:  {desc: "2x5 JTAG debug header (JTAG_HDR_10), next to P10", pins: 10,
        note: "pin order tentative — verify carrier sheet 6/13. NVCC_JTAG = 1.8 V, un-shifted."}
  DEV_MCU:
    desc: "DEV: carrier→MCU breakout (1.8V · GND · I2C · I2S) — bench-only pigtail"
    pins: 10
    status: draft
    complete: true
    note: "Development pigtail carrying I2C (control) + I2S/SAI (audio) to a dev codec/amp/mic.
      **LEVEL WARNING (measured 2026-09-20, SPIKE-1 — corrects an earlier WRONG 'all 1.8V' claim):
      the SAI3/I2S lines on P21.11-23 are a 3.3V bus, NOT 1.8V.** A 1.8V part wired here sees 3.3V.
      The on-carrier WM8731 codec (U10) runs at 3.3V (DBVDD=3V3) with 3.3V pull-ups directly on these
      SAI3 nets, behind an I2S level shifter (output-enabled by I2S_LS_OE) with the M.2 TXB0104 (U14)
      also on the bus. Measured: a 1.8V SoC GPIO driven high reads **3.3V** at P21.11/.15 (they FOLLOW
      the drive, level-shifted up: high→3.3V, low→0V); P21.17 (SAI3_RXD = codec ADCDAT *output*) is
      STUCK LOW regardless of drive — the powered codec contends and software cannot tri-state it.
      => P21.11-23 is NOT a clean 1.8V mic/I2S header; making it usable needs HARDWARE (3.3V parts +
      lift U10 ADCDAT + handle the shifter), not just disabling the codec driver. I2C5/6/4 on P21
      likely also cross the I2C shifter (I2C_LS_OE) — treat as 3.3V-suspect until measured. Only the
      power pins are 1.8V (1V8 from P10.2, GND P10.10).
      I2S pad map (reference): SAI3_MCLK=P21.15 · TXC/RXC=BCLK · TXFS/RXFS=LRCLK · TXD=DOUT · RXD=DIN."

# Carrier control/enable nets (NOT header pins — internal to the carrier; recorded for reference):
#   M.2/USB3 path (silkscreen "M.2 USB3 Enable"): HUB_OE, TCSW_EN (Type-C switch), HASW_EN,
#   plus I2C_LS_OE / I2S_LS_OE (level-shifter output-enables). Source: carrier sb-ucmimx8plus_1v1.

# Connectors on THIS board beyond the headers (see also products for product-side connectors).
connector_registry:
  M2_CARRIER_SBUCM:
    name: "SB-UCM eval-carrier M.2 (P9)"
    role: m2_socket
    keying: B
    positions: 67
    status: given                       # CompuLab-fixed; not our design to change
    purpose: "Modem / SSD / wireless — usable on the bench NOW (plug a Key-B card)"
    part: "CompuLab carrier ref P9 (M.2 B-key) + nanoSIM socket (P15)"
    source: "carrier sb-ucmimx8plus_1v1 sheet ('M.2 Socket - Key B', P9); hardware-reference.md"
    level: "3.3V (M.2 standard) — via carrier M.2 level shifters"
    connects: "USB2 (M2_USB_DP/DN) · USB3 (HOST, muxed to Key-B, HUB_OE/TCSW_EN gated) · PCIe x1
      (PCIE_CLKREQ_B, mPCIE_PERST) · nanoSIM (SIM_PWR/RST/CLK/DATA/CD, socket P15) · control
      (M2B_PWROFF#, M2B_3V3_W_DISABLE#, W_DIS1#) · +3.3V. NOT wired to SD1 (SDIO) on this carrier."
  FLEXSPI_BOOT:
    name: "FlexSPI boot-select header"
    role: boot_select
    status: given
    purpose: "Force FlexSPI (QSPI/octal-flash) boot mode; carrier silkscreen 'FlexSPI_BOOT'"
    source: "carrier sb-ucmimx8plus_1v1 (near SoM balls 97/98)"
  J9_J12:
    name: "J9–J12 — GMSL camera coax (FAKRA)"
    role: "camera_coax (4× FAKRA)"
    status: not-used                    # DECISION 2026-09-15: not using GMSL
    part: "FAKRA-RF-Male-50Ohm (4× round coax)"
    purpose: "Carrier's GMSL camera-over-coax path: 4× FAKRA (PO_COAX_FAKRA0-3) → MAX9286 GMSL1
      deserializer → MIPI-CSI2, 12 V PoC from P8. Chunky round industrial RF connectors."
    decision: "NOT USED. Camera goes via direct MIPI-CSI instead (cheaper, matches the product
      camera path). GMSL needs a matching GMSL1-serializer camera (expensive, automotive) and the
      MAX9286 is a carrier population option (may be DNP). Generic/analog coax cameras are NOT
      compatible. Bench cameras use the CSI2_SELECTOR mux in MIPI-CSI mode."
  # --- remaining CompuLab carrier I/O (all `given`; source: ucm-dev hardware-reference.md table) ---
  CAM_FPC:
    name: "Camera / display FPC (P11/P22/P49/P45)"
    role: camera_csi
    status: given
    part: "FPC 40 / 30 / 22 / 8-pin"
    purpose: "MIPI-CSI camera + display FPC connectors — THE camera path now GMSL is dropped
      (CSI2_SELECTOR in MIPI mode). See the camera-connectors skill / pinouts/ for the FPC maps."
  AUDIO_JACKS:
    name: "Analog audio jacks / RCA (J6–J8, P27)"
    role: audio_analog
    status: not-used                    # DECISION 2026-09-15: audio goes via the extension headers
    purpose: "Carrier WM8731 codec on SAI3 → 3.5mm jacks; P27 = RCA composite video."
    decision: "NOT USED. Audio is the SAI5 digital I2S path over the P20/P21 extension connectors
      (to MAX98357A / SPH0645), not the on-carrier WM8731/SAI3 analog codec. SAI3 is free to remux."
  CONSOLE_P13:
    name: "Serial console (P13, micro-USB B)"
    role: uart_console
    status: given
    purpose: "Debug console → CP2104 (U24) → i.MX UART2. Primary bench console."
  USBC_J5:
    name: "USB-C (J5)"
    role: usb_otg
    status: given
    purpose: "USB1 OTG/DRP (HD3SS3220): ROM SDP recovery (uuu) + USB-CDC usb0 gadget network;
      DP-alt-mode display offload (the product's 1V8 display path)."
  USB3A_J3:
    name: "USB3 Type-A (J3)"
    role: usb_host
    status: given
    purpose: "USB2 permanently host — networking only via a USB-Ethernet dongle."
  USD_P23:
    name: "Micro-SD (P23)"
    role: sd_card
    status: given
    purpose: "SD boot (safest bring-up), card-detect. Uses a uSDHC controller — see SD1 history."
  RJ45_P6:
    name: "RJ45 1GbE (P6)"
    role: ethernet
    status: given
    purpose: "Carrier AR8031 PHY — eth0 WORKS, 1 Gbps (verified 2026-09; needs `ip link set eth0 up`
      at cold boot — DMA race, not a fault). Planned M7-dedicated (DUT/diag); Linux day-to-day net is
      USB-CDC usb0 by design, not because eth0 is broken."
  HDMI_P14:
    name: "HDMI-A (P14)"
    role: hdmi
    status: given
    purpose: "Display out (bench). Product offloads display to USB-C DP-alt (1V8-everywhere rule)."
  PWR_J2:
    name: "DC power jack (J2)"
    role: power_in
    status: given
    purpose: "Main power in — 12 V nominal (jack rated 20 V/10 A; on-board buck)."
  GMSL_PWR_P8:
    name: "GMSL Power-over-Coax (P8, 12 V)"
    role: power_coax
    status: not-used
    purpose: "12 V PoC feed for the GMSL FAKRA cameras — not used (GMSL dropped, see J9_J12)."

