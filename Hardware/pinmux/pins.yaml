# CANONICAL pin-allocation source of truth (UCM-iMX8M-Plus / SB-UCM carrier).
# Humans + tools consume THIS; Markdown tables, cable lists and solver model are GENERATED from it
# (render.py / Makefile). Cross-checked by check.py. Level defaults to 1.8 V.
# Fields: som · func · dest · alts · verified · level · pad · tags
# `tags` are cross-cutting facets (see tag_vocab). check.py rejects tags not in the vocab.

meta:
  board: UCM-iMX8M-Plus / SB-UCM-iMX8Plus
  module: UCM-iMX8PLUS-C1800Q-D1-N16 (non-'E')
  default_level: 1.8
  # Ground-truth cross-check (check.py K-series): compare this MODEL against the drawn KiCad
  # schematic. Drift here is expected during design (board may lead/lag the plan) → warnings, not
  # errors. Skipped silently if schematic_dir is absent.
  kicad:
    schematic_dir: "../929/Faceboard"  # relative to pinmux/
    sound_connector: "20DS"            # DF40 size the sound path is *planned* to use (BOM/docs)
    audio_net_prefix: "SAI5"           # audio bus family expected on the board

# Controlled tag vocabulary (facets). Add here first, then use on pins.
tag_vocab:
  iface:  [audio, i2c, uart, can, sd, spi, pwm, hdmi, pcie, m2, gpio, power, reset, ethernet]
  bus:    [sai5, sai3, i2c3, i2c4, i2c5, i2c6, can1, can2, sd1, sd2, ecspi2, uart1, uart2, uart3, uart4]
  role:   [speaker, mic, bclk, lrclk, mclk, clk, data, sync, enable, int, prog, console, pwr-ctrl, gnd, rail, reserved]
  sys:    [sound, camera, supervisor, sensors, m2keyb, debug]
  volt:   [v1p8, v3p3, v5]
  status: [measured, tentative, unverified]
  profile: [product, bench]

connectors:
  P20: {desc: "2x17 0.1in expansion header", pins: 34, power: "5V / 3V3 / GND (unlisted pins)"}
  P21: {desc: "2x17 0.1in expansion header", pins: 34}
  P10: {desc: "2x5 power/reset/system-control (DR10SM)", pins: 10, note: "pin order tentative — verify sheet 6"}

# Connector registry — first-class connectors beyond the P20/P21/P10 headers.
# `status`: given (vendor-fixed, not our design) · placed (drawn in KiCad) · draft (planned, may change).
# Detailed far-side pinouts live in the linked `pinout:` doc (single source) — here we track identity,
# keying, wiring summary (how it connects to the SoM), level domain, and status. check.py K4 audits these.
connector_registry:
  M2_CARRIER_SBUCM:
    name: "SB-UCM eval-carrier M.2 (P9)"
    board: sb-ucm-imx8plus-carrier
    role: m2_socket
    keying: B
    positions: 67
    status: given                       # CompuLab-fixed; not our design to change
    purpose: "Modem / SSD"
    part: "CompuLab carrier ref P9 (M.2 B-key)"
    source: "sb-ucm-imx8plus_bom_1v1; ucm-dev hardware-reference.md"
    level: "3.3V (M.2 standard)"
    connects: "SoM PCIe x1 (modem) + SATA/SDIO (SSD) + USB per CompuLab carrier design"
  M2_929_KEYB:
    name: "929 Faceboard M.2 Key B"
    board: 929-faceboard
    role: m2_socket
    keying: B
    positions: 67                        # M.2 standard; pinout doc numbers 1–75 with gaps
    status: placed
    purpose: "WWAN/LoRa/SIM + Key-M storage (SD2) + I2S audio (SAI5) + PCIe"
    part: "Amphenol 10128793-001RLF"
    pinout: "../pinouts/M2_KEY_B_CONNECTOR.md"
    kicad: "929/Faceboard/m2-key-b.kicad_sch"
    level: "mixed 1.8/3.3 — TXS0104 shifters + SN74CB3Q3245 bus switch (challenge C5)"
    connects: "SoM via P20/P21 — SAI5 I2S spk+mic (TXC/TXFS/TXD0/RXFS/RXD0), SD2 Key-M
      (DATA0-3/CMD/CLK), PCIe (RXN±/TXN±/REFCLK±/CLKREQ/WAKE/PERST), USB2 D±, USB3 SSTX/SSRX±,
      I2C3 (GNSS/STEM), UART2 (COEX/LoRa/debug)"
    som_signals: [SAI5_TXC, SAI5_TXFS, SAI5_TXD0, SAI5_RXFS, SAI5_RXD0, SD2_x, PCIE_x,
                  USB2, USB3, I2C3, UART2]
  M2_PRODUCT:
    name: "Product M.2 (planned)"
    board: product
    role: m2_socket
    keying: B                           # CURRENT PLAN — mirrors the 929 Key B
    keying_status: TBD                  # type NOT finalized; may change (B / E / M)
    positions: 67
    status: draft
    purpose: "current plan = Key B (WWAN/LoRa/SIM + storage); type not locked"
    pinout: "../pinouts/M2_KEY_B_CONNECTOR.md"
    alternatives: "Key E (WiFi/BT WNFB-266XI over SD1/UART2) — ../pinouts/M2_KEY_E_CONNECTOR.md"
    note: "DRAFT — keying B/E/M undecided; current plan follows the 929 Key B. Revisit before layout."

